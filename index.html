<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tunebox" />
  <meta name="theme-color" content="#0f0f13" />
  <title>Tunebox</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #242430;
      --border: #2e2e3a;
      --text: #f0f0f5;
      --text2: #a0a0b0;
      --accent: #7c6af5;
      --accent2: #9b8cff;
      --danger: #ff5c7a;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: calc(90px + var(--safe-bottom));
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 19, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .song-count {
      font-size: 14px;
      color: var(--text2);
    }

    .tabs {
      display: flex;
      gap: 8px;
      background: var(--surface);
      border-radius: 12px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--surface2);
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 12px;
      padding: 16px 20px 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, var(--accent), #5b4bc4);
      color: white;
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .order-bar {
      display: flex;
      gap: 8px;
      padding: 8px 20px 16px;
      overflow-x: auto;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .list { padding: 0 12px 20px; }

    .song-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .song-item:active { background: var(--surface); }
    .song-item.playing { background: rgba(124, 106, 245, 0.12); }

    .song-art {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #3d2f8a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .song-info { flex: 1; min-width: 0; }

    .song-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      font-size: 13px;
      color: var(--text2);
      margin-top: 2px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text2);
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active { background: var(--surface2); }

    .empty {
      text-align: center;
      padding: 60px 30px;
      color: var(--text2);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty p { font-size: 15px; line-height: 1.5; }

    .mini-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(10px + var(--safe-bottom));
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mini-player.visible { transform: translateY(0); }

    .mini-art {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #3d2f8a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .mini-info { flex: 1; min-width: 0; }

    .mini-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-artist { font-size: 12px; color: var(--text2); }

    .mini-controls { display: flex; align-items: center; gap: 4px; }

    .mini-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-btn.play {
      background: var(--accent);
      color: white;
      font-size: 18px;
    }

    .player-sheet {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .player-sheet.open { transform: translateY(0); }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }

    .player-header button {
      width: 40px;
      height: 40px;
      border: none;
      background: var(--surface);
      color: var(--text);
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .player-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 30px;
      gap: 24px;
    }

    .player-art {
      width: min(280px, 70vw);
      height: min(280px, 70vw);
      border-radius: 24px;
      background: linear-gradient(145deg, var(--accent), #2a1f6e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      font-weight: 700;
      color: white;
      box-shadow: 0 20px 60px rgba(124, 106, 245, 0.3);
    }

    .player-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-artist {
      font-size: 16px;
      color: var(--text2);
      margin-top: -12px;
    }

    .progress-wrap { width: 100%; max-width: 360px; }

    .progress-bar {
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text2);
      margin-top: 8px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-top: 8px;
    }

    .ctrl-btn {
      width: 52px;
      height: 52px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn.play {
      width: 68px;
      height: 68px;
      background: var(--accent);
      color: white;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(124, 106, 245, 0.4);
    }

    .ctrl-btn.mode { font-size: 20px; color: var(--text2); }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 280px;
      margin-top: 8px;
    }

    .volume-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      outline: none;
    }

    .volume-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      border-radius: 14px;
      cursor: pointer;
    }

    .playlist-item:active { background: var(--surface); }

    .playlist-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 500px;
      padding: 24px 20px calc(24px + var(--safe-bottom));
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal h3 { font-size: 18px; margin-bottom: 16px; }

    .modal input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }

    .modal-actions { display: flex; gap: 12px; }
    .modal-actions .btn { flex: 1; }

    .context-menu {
      position: fixed;
      background: var(--surface2);
      border-radius: 14px;
      padding: 8px;
      z-index: 400;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      min-width: 180px;
      display: none;
    }

    .context-menu.open { display: block; }

    .context-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      color: var(--text);
    }

    .context-item:active { background: var(--surface); }
    .context-item.danger { color: var(--danger); }

    #fileInput { display: none; }

    .drag-handle {
      color: var(--text2);
      font-size: 18px;
      padding: 0 4px;
      cursor: grab;
    }

    .toast {
      position: fixed;
      bottom: calc(110px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 500;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1>Tunebox</h1>
      <span class="song-count" id="songCount">0 songs</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="songs">Songs</button>
      <button class="tab" data-tab="playlists">Playlists</button>
    </div>
  </div>

  <div class="actions" id="songsActions">
    <button class="btn btn-primary" id="playAllBtn"><span>▶</span> Play</button>
    <button class="btn btn-secondary" id="addMusicBtn"><span>+</span> Add music</button>
  </div>

  <div class="order-bar" id="orderBar">
    <button class="chip active" data-mode="order">→ In order</button>
    <button class="chip" data-mode="reverse">← Reverse</button>
    <button class="chip" data-mode="shuffle">⇄ Shuffle</button>
    <button class="chip" id="reorderBtn">Reorder</button>
  </div>

  <div class="list" id="songList"></div>
  <div class="list" id="playlistList" style="display:none;"></div>
  <div class="actions" id="playlistActions" style="display:none;">
    <button class="btn btn-primary" id="createPlaylistBtn" style="flex:1;">+ New Playlist</button>
  </div>

  <div class="mini-player" id="miniPlayer">
    <div class="mini-art" id="miniArt">♪</div>
    <div class="mini-info" id="miniInfo">
      <div class="mini-title" id="miniTitle">Not playing</div>
      <div class="mini-artist" id="miniArtist">—</div>
    </div>
    <div class="mini-controls">
      <button class="mini-btn" id="miniPrev">⏮</button>
      <button class="mini-btn play" id="miniPlay">▶</button>
      <button class="mini-btn" id="miniNext">⏭</button>
    </div>
  </div>

  <div class="player-sheet" id="playerSheet">
    <div class="player-header">
      <button id="closePlayer">↓</button>
      <span style="font-weight:600;font-size:15px;">Now Playing</span>
      <button id="morePlayer">•••</button>
    </div>
    <div class="player-body">
      <div class="player-art" id="playerArt">♪</div>
      <div>
        <div class="player-title" id="playerTitle">—</div>
        <div class="player-artist" id="playerArtist">—</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn mode" id="modeBtn">→</button>
        <button class="ctrl-btn" id="prevBtn">⏮</button>
        <button class="ctrl-btn play" id="playBtn">▶</button>
        <button class="ctrl-btn" id="nextBtn">⏭</button>
        <button class="ctrl-btn" id="loopBtn">🔂</button>
      </div>
      <div class="volume-row">
        <span>🔈</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" />
        <span>🔊</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="playlistModal">
    <div class="modal">
      <h3>New Playlist</h3>
      <input type="text" id="playlistNameInput" placeholder="Playlist name" maxlength="40" />
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelPlaylist">Cancel</button>
        <button class="btn btn-primary" id="savePlaylist">Create</button>
      </div>
    </div>
  </div>

  <div class="context-menu" id="contextMenu"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="audio/*" multiple />

  <script>
    const DB_NAME = 'tunebox-db';
    const DB_VERSION = 1;
    let db = null;
    let songs = [];
    let playlists = [];
    let queue = [];
    let currentIndex = -1;
    let isPlaying = false;
    let playMode = 'order';
    let isLoop = false;
    let isReorderMode = false;
    let currentTab = 'songs';
    let currentPlaylistId = null;
    const audio = new Audio();
    audio.preload = 'metadata';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('songs')) database.createObjectStore('songs', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('playlists')) database.createObjectStore('playlists', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('meta')) database.createObjectStore('meta', { keyPath: 'key' });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = () => reject(req.error);
      });
    }

    function saveSongs() {
      const tx = db.transaction('songs', 'readwrite');
      const store = tx.objectStore('songs');
      store.clear();
      songs.forEach(s => store.put(s));
    }

    function loadSongs() {
      return new Promise((resolve) => {
        const tx = db.transaction('songs', 'readonly');
        const req = tx.objectStore('songs').getAll();
        req.onsuccess = () => { songs = req.result || []; resolve(); };
      });
    }

    function savePlaylists() {
      const tx = db.transaction('playlists', 'readwrite');
      const store = tx.objectStore('playlists');
      store.clear();
      playlists.forEach(p => store.put(p));
    }

    function loadPlaylists() {
      return new Promise((resolve) => {
        const tx = db.transaction('playlists', 'readonly');
        const req = tx.objectStore('playlists').getAll();
        req.onsuccess = () => { playlists = req.result || []; resolve(); };
      });
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + s.toString().padStart(2, '0');
    }

    function getLetter(title) {
      const clean = title.replace(/[^\p{L}\p{N}]/gu, '');
      return (clean[0] || '♪').toUpperCase();
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function parseFilename(name) {
      const base = name.replace(/\.[^/.]+$/, '');
      const parts = base.split(' - ');
      if (parts.length >= 2) return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
      return { artist: 'Unknown', title: base };
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderSongs() {
      const list = document.getElementById('songList');
      document.getElementById('songCount').textContent = songs.length + ' song' + (songs.length !== 1 ? 's' : '');
      if (songs.length === 0) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">🎵</div><p>No songs yet.<br>Tap <b>Add music</b> and choose files.</p></div>';
        return;
      }
      list.innerHTML = songs.map((song, i) => {
        const isCurrent = queue[currentIndex] === song.id;
        return '<div class="song-item ' + (isCurrent ? 'playing' : '') + '" data-id="' + song.id + '" data-index="' + i + '">' +
          (isReorderMode ? '<span class="drag-handle">☰</span>' : '') +
          '<div class="song-art">' + song.letter + '</div>' +
          '<div class="song-info"><div class="song-title">' + escapeHtml(song.title) + '</div>' +
          '<div class="song-meta">' + escapeHtml(song.artist) + ' · ' + formatTime(song.duration) + '</div></div>' +
          '<button class="icon-btn more-btn" data-id="' + song.id + '">•••</button></div>';
      }).join('');
      list.querySelectorAll('.song-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.more-btn') || e.target.closest('.drag-handle')) return;
          playSongById(el.dataset.id);
        });
      });
      list.querySelectorAll('.more-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); showContextMenu(e, btn.dataset.id); });
      });
    }

    function renderPlaylists() {
      const list = document.getElementById('playlistList');
      if (playlists.length === 0) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><p>No playlists yet.<br>Create one and add songs to it.</p></div>';
        return;
      }
      list.innerHTML = playlists.map(p => {
        const count = p.songIds.length;
        return '<div class="playlist-item" data-id="' + p.id + '"><div class="playlist-icon">📂</div>' +
          '<div class="song-info"><div class="song-title">' + escapeHtml(p.name) + '</div>' +
          '<div class="song-meta">' + count + ' song' + (count !== 1 ? 's' : '') + '</div></div>' +
          '<button class="icon-btn more-btn" data-id="' + p.id + '">•••</button></div>';
      }).join('');
      list.querySelectorAll('.playlist-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.more-btn')) return;
          openPlaylist(el.dataset.id);
        });
      });
    }

    function updateMiniPlayer() {
      const mini = document.getElementById('miniPlayer');
      if (currentIndex < 0 || !queue.length) { mini.classList.remove('visible'); return; }
      const song = songs.find(s => s.id === queue[currentIndex]);
      if (!song) return;
      mini.classList.add('visible');
      document.getElementById('miniTitle').textContent = song.title;
      document.getElementById('miniArtist').textContent = song.artist;
      document.getElementById('miniArt').textContent = song.letter;
      document.getElementById('miniPlay').textContent = isPlaying ? '⏸' : '▶';
      document.getElementById('playerTitle').textContent = song.title;
      document.getElementById('playerArtist').textContent = song.artist;
      document.getElementById('playerArt').textContent = song.letter;
      document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildQueue(startId) {
      let ids = songs.map(s => s.id);
      if (currentPlaylistId) {
        const pl = playlists.find(p => p.id === currentPlaylistId);
        if (pl) ids = pl.songIds.slice();
      }
      if (playMode === 'reverse') ids = ids.slice().reverse();
      else if (playMode === 'shuffle') ids = shuffleArray(ids.slice());
      queue = ids;
      if (startId) {
        const idx = queue.indexOf(startId);
        currentIndex = idx >= 0 ? idx : 0;
      } else {
        currentIndex = queue.length ? 0 : -1;
      }
    }

    function playSongById(id) { buildQueue(id); loadAndPlay(); }

    function loadAndPlay() {
      if (currentIndex < 0 || !queue.length) return;
      const song = songs.find(s => s.id === queue[currentIndex]);
      if (!song) return;
      if (audio.src && audio.src.startsWith('blob:')) URL.revokeObjectURL(audio.src);
      audio.src = URL.createObjectURL(song.blob);
      audio.load();
      audio.play().then(() => {
        isPlaying = true;
        updateMiniPlayer();
        renderSongs();
      }).catch(() => toast('Could not play this file'));
    }

    function togglePlay() {
      if (!queue.length) {
        if (songs.length) { buildQueue(); loadAndPlay(); }
        return;
      }
      if (isPlaying) { audio.pause(); isPlaying = false; }
      else { audio.play().then(() => { isPlaying = true; }).catch(() => toast('Playback error')); }
      updateMiniPlayer();
    }

    function playNext() {
      if (!queue.length) return;
      if (currentIndex < queue.length - 1) currentIndex++;
      else if (isLoop) currentIndex = 0;
      else { isPlaying = false; updateMiniPlayer(); return; }
      loadAndPlay();
    }

    function playPrev() {
      if (!queue.length) return;
      if (audio.currentTime > 3) { audio.currentTime = 0; return; }
      if (currentIndex > 0) currentIndex--;
      else if (isLoop) currentIndex = queue.length - 1;
      else { audio.currentTime = 0; return; }
      loadAndPlay();
    }

    function addMusicFiles(files) {
      const audioFiles = Array.from(files).filter(f => f.type.startsWith('audio/'));
      if (!audioFiles.length) { toast('No audio files selected'); return; }
      let added = 0;
      const promises = audioFiles.map(file => new Promise((resolve) => {
        const parsed = parseFilename(file.name);
        const id = uid();
        const letter = getLetter(parsed.title);
        const tempAudio = new Audio();
        const url = URL.createObjectURL(file);
        tempAudio.src = url;
        tempAudio.addEventListener('loadedmetadata', () => {
          songs.push({ id, title: parsed.title, artist: parsed.artist, duration: tempAudio.duration || 0, blob: file, letter });
          added++;
          URL.revokeObjectURL(url);
          resolve();
        });
        tempAudio.addEventListener('error', () => {
          songs.push({ id, title: parsed.title, artist: parsed.artist, duration: 0, blob: file, letter });
          added++;
          URL.revokeObjectURL(url);
          resolve();
        });
      }));
      Promise.all(promises).then(() => {
        saveSongs();
        renderSongs();
        toast('Added ' + added + ' song' + (added !== 1 ? 's' : ''));
      });
    }

    function createPlaylist(name) {
      if (!name.trim()) return;
      playlists.push({ id: uid(), name: name.trim(), songIds: [] });
      savePlaylists();
      renderPlaylists();
      toast('Playlist created');
    }

    function openPlaylist(id) {
      currentPlaylistId = id;
      const pl = playlists.find(p => p.id === id);
      if (!pl) return;
      toast('Playing from "' + pl.name + '"');
      switchTab('songs');
      if (pl.songIds.length) { buildQueue(pl.songIds[0]); loadAndPlay(); }
    }

    function addSongToPlaylist(songId, playlistId) {
      const pl = playlists.find(p => p.id === playlistId);
      if (!pl) return;
      if (!pl.songIds.includes(songId)) {
        pl.songIds.push(songId);
        savePlaylists();
        toast('Added to playlist');
      }
    }

    function showContextMenu(e, songId) {
      const menu = document.getElementById('contextMenu');
      menu.innerHTML = '<div class="context-item" data-action="play">▶ Play</div>' +
        '<div class="context-item" data-action="add-to-pl">＋ Add to playlist</div>' +
        '<div class="context-item danger" data-action="delete">🗑 Delete</div>';
      menu.classList.add('open');
      const rect = e.target.getBoundingClientRect();
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.left = Math.min(rect.left, window.innerWidth - 200) + 'px';
      menu.querySelectorAll('.context-item').forEach(item => {
        item.addEventListener('click', () => {
          const action = item.dataset.action;
          if (action === 'play') playSongById(songId);
          if (action === 'delete') {
            songs = songs.filter(s => s.id !== songId);
            playlists.forEach(p => { p.songIds = p.songIds.filter(id => id !== songId); });
            saveSongs();
            savePlaylists();
            if (queue[currentIndex] === songId) {
              audio.pause(); isPlaying = false; currentIndex = -1; queue = [];
            }
            renderSongs();
            updateMiniPlayer();
            toast('Song deleted');
          }
          if (action === 'add-to-pl') {
            if (!playlists.length) toast('Create a playlist first');
            else {
              const choice = prompt('Add to which playlist?\n' + playlists.map((p, i) => (i + 1) + '. ' + p.name).join('\n'));
              const idx = parseInt(choice, 10) - 1;
              if (idx >= 0 && idx < playlists.length) addSongToPlaylist(songId, playlists[idx].id);
            }
          }
          menu.classList.remove('open');
        });
      });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#contextMenu') && !e.target.closest('.more-btn')) {
        document.getElementById('contextMenu').classList.remove('open');
      }
    });

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('songList').style.display = tab === 'songs' ? 'block' : 'none';
      document.getElementById('songsActions').style.display = tab === 'songs' ? 'flex' : 'none';
      document.getElementById('orderBar').style.display = tab === 'songs' ? 'flex' : 'none';
      document.getElementById('playlistList').style.display = tab === 'playlists' ? 'block' : 'none';
      document.getElementById('playlistActions').style.display = tab === 'playlists' ? 'flex' : 'none';
      if (tab === 'songs') renderSongs(); else renderPlaylists();
    }

    document.getElementById('addMusicBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', (e) => {
      if (e.target.files.length) { addMusicFiles(e.target.files); e.target.value = ''; }
    });
    document.getElementById('playAllBtn').addEventListener('click', () => {
      if (!songs.length) { toast('Add some music first'); return; }
      buildQueue();
      loadAndPlay();
    });
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });
    document.querySelectorAll('.chip[data-mode]').forEach(chip => {
      chip.addEventListener('click', () => {
        playMode = chip.dataset.mode;
        document.querySelectorAll('.chip[data-mode]').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        document.getElementById('modeBtn').textContent = { order: '→', reverse: '←', shuffle: '⇄' }[playMode];
        toast('Mode: ' + playMode);
      });
    });
    document.getElementById('reorderBtn').addEventListener('click', () => {
      isReorderMode = !isReorderMode;
      document.getElementById('reorderBtn').classList.toggle('active', isReorderMode);
      renderSongs();
      toast(isReorderMode ? 'Reorder on' : 'Reorder off');
    });
    document.getElementById('miniPlay').addEventListener('click', togglePlay);
    document.getElementById('miniPrev').addEventListener('click', playPrev);
    document.getElementById('miniNext').addEventListener('click', playNext);
    document.getElementById('miniInfo').addEventListener('click', () => document.getElementById('playerSheet').classList.add('open'));
    document.getElementById('miniArt').addEventListener('click', () => document.getElementById('playerSheet').classList.add('open'));
    document.getElementById('closePlayer').addEventListener('click', () => document.getElementById('playerSheet').classList.remove('open'));
    document.getElementById('playBtn').addEventListener('click', togglePlay);
    document.getElementById('prevBtn').addEventListener('click', playPrev);
    document.getElementById('nextBtn').addEventListener('click', playNext);
    document.getElementById('modeBtn').addEventListener('click', () => {
      const modes = ['order', 'reverse', 'shuffle'];
      playMode = modes[(modes.indexOf(playMode) + 1) % 3];
      document.getElementById('modeBtn').textContent = { order: '→', reverse: '←', shuffle: '⇄' }[playMode];
      document.querySelectorAll('.chip[data-mode]').forEach(c => c.classList.toggle('active', c.dataset.mode === playMode));
      toast('Mode: ' + playMode);
    });
    document.getElementById('loopBtn').addEventListener('click', () => {
      isLoop = !isLoop;
      document.getElementById('loopBtn').style.color = isLoop ? 'var(--accent)' : '';
      toast(isLoop ? 'Repeat on' : 'Repeat off');
    });
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      document.getElementById('progressFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
      document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
      document.getElementById('duration').textContent = formatTime(audio.duration);
    });
    audio.addEventListener('ended', playNext);
    document.getElementById('progressBar').addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });
    document.getElementById('volumeSlider').addEventListener('input', (e) => { audio.volume = e.target.value; });
    document.getElementById('createPlaylistBtn').addEventListener('click', () => {
      document.getElementById('playlistModal').classList.add('open');
      document.getElementById('playlistNameInput').value = '';
      document.getElementById('playlistNameInput').focus();
    });
    document.getElementById('cancelPlaylist').addEventListener('click', () => {
      document.getElementById('playlistModal').classList.remove('open');
    });
    document.getElementById('savePlaylist').addEventListener('click', () => {
      createPlaylist(document.getElementById('playlistNameInput').value);
      document.getElementById('playlistModal').classList.remove('open');
    });

    async function init() {
      await openDB();
      await loadSongs();
      await loadPlaylists();
      renderSongs();
      renderPlaylists();
      updateMiniPlayer();
    }
    init();
  </script>
</body>
</html>
